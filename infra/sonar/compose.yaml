name: digital-store-sonar

services:
  sonar-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: ${SONAR_DB_USER:?Define SONAR_DB_USER en .env}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?Define SONAR_DB_PASSWORD en .env}
    volumes:
      - sonar-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  sonarqube:
    image: sonarqube:26.11.0.134175-community
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonarqube
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER:?Define SONAR_DB_USER en .env}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?Define SONAR_DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
      - sonar-logs:/opt/sonarqube/logs
    depends_on:
      sonar-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sonar-db-data:
  sonar-data:
  sonar-extensions:
  sonar-logs: