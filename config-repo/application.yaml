eureka:
  client:
    serviceUrl:
      defaultZone: http://discovery-server:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    export:
      otlp:
        enabled: false
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
    propagation:
      type: W3C
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  otlp:
    metrics:
      export:
        enabled: false

spring:
  mvc:
    problemdetails:
      enabled: true

logging:
  level:
    root: INFO
    com.netflix.discovery: WARN
  pattern:
    console: >-
      %d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level
      [traceId=%X{traceId:-}]
      %replace(%msg){'[\r\n]+',' '}%n