spring:
  application:
    name: catalog-service
  datasource:
    url: ${DB_URL_POSTGRES:jdbc:postgresql://localhost:5432/catalog_db}
    username: ${DB_USERNAME_POSTGRES}
    password: ${DB_PASSWORD_POSTGRES}
  flyway:
    locations:
      - classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: false
        format_sql: true
    open-in-view: false
  config:
    import: ${SPRING_CONFIG_IMPORT:optional:configserver:http://localhost:8888}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/digital-store
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8081/realms/digital-store/protocol/openid-connect/certs}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      connect-timeout: 300ms
      timeout: 300ms
catalog:
  storage:
    root: ${CATALOG_STORAGE_PATH:./local-product-files}
management:
  health:
    redis:
      enabled: false
