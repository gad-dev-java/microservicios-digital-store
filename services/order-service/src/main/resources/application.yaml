spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL_POSTGRES:jdbc:postgresql://localhost:5432/orders_db}
    username: ${DB_USERNAME_POSTGRES}
    password: ${DB_PASSWORD_POSTGRES}
  flyway:
    locations:
      - classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: true
        format_sql: true
  config:
    import: ${SPRING_CONFIG_IMPORT:optional:configserver:http://localhost:8888}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/digital-store
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8081/realms/digital-store/protocol/openid-connect/certs}
      client:
        registration:
          order-catalog:
            provider: keycloak-internal
            client-id: order-service-client
            client-secret: ${ORDER_SERVICE_CLIENT_SECRET}
            client-authentication-method: client_secret_basic
            authorization-grant-type: client_credentials
        provider:
          keycloak-internal:
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8081/realms/digital-store/protocol/openid-connect/token}
  http:
    clients:
      connect-timeout: 500ms
      read-timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 8000

outbox:
  relay:
    enabled: true
    topic: orders.events.v1
    fixed-delay-ms: 2000
    initial-delay-ms: 5000
    batch-size: 20
    lease-seconds: 30
    ack-timeout-seconds: 10
    max-attempts: 5