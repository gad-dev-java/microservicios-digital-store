spring:
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  cloud:
    config:
      enabled: false
  security:
    oauth2:
      client:
        registration:
          order-catalog:
            client-secret: test-secret
eureka:
  client:
    enabled: false
outbox:
  relay:
    enabled: false
retention:
  purge:
    enabled: false