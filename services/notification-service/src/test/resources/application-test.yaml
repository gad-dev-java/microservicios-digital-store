spring:
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  cloud:
    config:
      enabled: false
  kafka:
    listener:
      auto-startup: false
eureka:
  client:
    enabled: false
app:
  notifications:
    sender:
      enabled: false
retention:
  purge:
    enabled: false