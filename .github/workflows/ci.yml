name: CI

on:
  push:
    branches:
      - master
      - 'chore/**'
      - 'feat/**'
      - 'fix/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64, portafolio-local]
    env:
      COMPOSE_PROJECT_NAME: ci-${{ github.run_id }}
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci-placeholder
      KEYCLOAK_ADMIN: ci
      KEYCLOAK_ADMIN_PASSWORD: ci-placeholder
      ORDER_SERVICE_CLIENT_SECRET: ci-placeholder
      MERCADOPAGO_ACCESS_TOKEN: ci-placeholder
      MERCADOPAGO_WEBHOOK_SECRET: ci-placeholder
      MERCADOPAGO_APPLICATION_ID: ci-placeholder
      MERCADOPAGO_EXPECTED_LIVE_MODE: 'false'

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verificar formato Java, pruebas y cobertura
        run: bash ./mvnw -B clean verify

      - name: Analizar Java y esperar Quality Gate
        if: github.ref == 'refs/heads/master'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          test -n "$SONAR_TOKEN"
          test -n "$SONAR_HOST_URL"
          bash ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar \
            -Dsonar.projectKey=digital-store \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Validar contrato OpenAPI
        run: npx --yes @redocly/cli@2.79.0 lint docs/contracts/http-api-v1.yaml --extends=spec

      - name: Instalar dependencias web
        working-directory: web
        run: npm ci

      - name: Revisar estilo web
        working-directory: web
        run: npm run lint

      - name: Compilar web
        working-directory: web
        run: npm run build

      - name: Construir imágenes
        run: docker compose build

      - name: Prueba ligera de catálogo con k6
        run: |
          set -euo pipefail
          mkdir -p infra/perf/results
          trap 'docker compose -f compose.yaml -f infra/perf/compose.ci.yaml down -v --remove-orphans' EXIT
          docker compose -f compose.yaml -f infra/perf/compose.ci.yaml up -d --wait redis catalog-service
          docker compose -f compose.yaml -f infra/perf/compose.ci.yaml run --rm --no-deps \
            -e K6_MODE=catalog \
            -e K6_BASE_URL=http://catalog-service:8080 \
            -e PERF_VUS=1 \
            -e PERF_DURATION=10s \
            -e K6_P95_MS=500 \
            -e K6_REPORT=/results/ci-catalog.json \
            k6 run /scripts/store.js

      - name: Guardar reporte k6
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k6-ci-${{ github.run_id }}
          path: infra/perf/results/ci-catalog.json
          if-no-files-found: warn
          retention-days: 14

      - name: Instalar Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.76.2
          cache: true

      - name: Generar SBOM y escanear imágenes
        run: bash infra/security/scan-images.sh

      - name: Guardar SBOM e informes de Trivy
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-ci-${{ github.run_id }}
          path: security-reports/
          if-no-files-found: warn
          retention-days: 14
