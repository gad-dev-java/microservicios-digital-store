name: CI

on:
  push:
    branches:
      - master
      - 'chore/**'
      - 'feat/**'
      - 'fix/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, Windows, X64, portfolio-local]

    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verificar Java
        run: .\mvnw.cmd verify

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias web
        working-directory: web
        run: npm ci

      - name: Compilar web
        working-directory: web
        run: npm run build

      - name: Construir imágenes
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-placeholder
          KEYCLOAK_ADMIN: ci
          KEYCLOAK_ADMIN_PASSWORD: ci-placeholder
        run: docker compose build