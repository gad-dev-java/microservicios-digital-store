name: Deploy local

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: [self-hosted, Linux, X64, portafolio-local]

    defaults:
      run:
        shell: bash

    env:
      COMPOSE_PROJECT_NAME: portafolio
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      KEYCLOAK_ADMIN: ${{ secrets.KEYCLOAK_ADMIN }}
      KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
      ORDER_SERVICE_CLIENT_SECRET: ${{ secrets.ORDER_SERVICE_CLIENT_SECRET }}
      MERCADOPAGO_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}
      MERCADOPAGO_WEBHOOK_SECRET: ${{ secrets.MERCADOPAGO_WEBHOOK_SECRET }}

    steps:
      - uses: actions/checkout@v7

      - name: Validar Compose
        run: docker compose config --quiet

      - name: Desplegar
        run: docker compose up --build -d

      - name: Revisar contenedores
        run: docker compose ps