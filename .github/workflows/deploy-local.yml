name: Deploy local

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: [self-hosted, Linux, X64, portafolio-local]

    defaults:
      run:
        shell: bash

    env:
      COMPOSE_PROJECT_NAME: portafolio
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      KEYCLOAK_ADMIN: ${{ secrets.KEYCLOAK_ADMIN }}
      KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
      ORDER_SERVICE_CLIENT_SECRET: ${{ secrets.ORDER_SERVICE_CLIENT_SECRET }}
      MERCADOPAGO_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}
      MERCADOPAGO_WEBHOOK_SECRET: ${{ secrets.MERCADOPAGO_WEBHOOK_SECRET }}
      MERCADOPAGO_APPLICATION_ID: ${{ secrets.MERCADOPAGO_APPLICATION_ID }}
      MERCADOPAGO_EXPECTED_LIVE_MODE: 'false'

    steps:
      - uses: actions/checkout@v7

      - name: Validar Compose
        run: docker compose config --quiet

      - name: Construir imágenes
        run: docker compose build

      - name: Instalar Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.76.2
          cache: true

      - name: Generar SBOM y escanear imágenes
        run: bash infra/security/scan-images.sh

      - name: Guardar SBOM e informes de Trivy
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-deploy-${{ github.run_id }}
          path: security-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Desplegar imágenes aprobadas
        run: docker compose up --no-build -d

      - name: Revisar contenedores
        run: docker compose ps